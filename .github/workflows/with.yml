name: Example Workflow

on: push

jobs:
  example-job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4  # ✅ Must use `uses`
        with:
          ref: "develop"  # ✅ Passes the branch name

      - name: Print a Message
        run: echo "Hello, DevOps Engineer!"  # ❌ `run` does NOT support `with`
